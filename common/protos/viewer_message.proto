syntax = "proto2";

//Message explains the error in details.
message Error {
  required int32 status = 1;

  enum ErrorType {
    ERROR_UNKNOWN = 0;
    ERROR_GERRIT_HOST = 1;
    ERROR_CHANGE_NUMBER = 2;
    ERROR_PATCH_NUMBER = 3;
  }

  required ErrorType error_type = 2;
  optional string details = 3;
}

//Message contains the extra (non-generic) build info.
message ExtraBuildInfo{
  enum BuildCategory {
    UNKNOWN = 0;
    PRE_CQ = 1;
    CQ = 2;
  }

  required BuildCategory build_category = 1;
  optional string buildbucket_id = 2;
  optional string url = 3;
}

//Message contains a general build information.
message Build {
  enum BuildNamespace {
    CROS_BUILD = 1;
  }
  required BuildNamespace build_namespace = 1;

  required string build_name = 2;
  optional string build_id = 3;

  enum BuildStatus {
    UNKNOWN = 0;
    SCHEDULED = 1;
    STARTED = 2;
    PASSED = 3;
    FAILED = 4;
    CANCELED = 5;
  }
  required BuildStatus build_status = 4;

  optional int64 start_time = 5;
  optional int64 end_time = 6;
  optional ExtraBuildInfo extra_build_info = 7;
}

//Message presents a change (CL).
message Change {
  required string gerrit_host = 1;
  required int64 change_number = 2;
  required int64 patch_number = 3;
}

//Message contains the data to return in the Response.
message Data {
  required Change change = 1;

  enum ChangeStatus {
    UNKNOWN = 0;
    PENDING_FOR_PRE_CQ_VALIDATION = 1;
    PENDING_FOR_CQ_VALIDATION = 2;
    SUBMITTED = 3;
  }
  required ChangeStatus change_status = 3;
  repeated Build builds = 2;
}

//Message presents a Response to a GetCLStatus Request.
message GetCLStatusResponse {
  optional Data data = 1;
  repeated Error errors = 2;
}

//Message presents a Request to GetCLStatus.
message GetCLStatusRequest {
  required Change change = 1;
}

